# Grimoire book configuration for the @deckyard/astm documentation.

[book]
title = "@deckyard/astm"
description = "ASTM E1381 / E1394 (CLSI LIS01-A2 / LIS02-A2) lab-instrument protocol"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-astm/"
repoUrl = "https://github.com/deckyard/deck-astm"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-astm/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
